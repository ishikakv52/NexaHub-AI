<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | NEXA HUB AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* ================= THEME ================= */

:root{

    --bg:#020617;
    --card:rgba(15,23,42,.88);
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:rgba(148,163,184,.20);
    --input:#0f172a;
    --primary:#06b6d4;
    --secondary:#7c3aed;
    --shadow:0 25px 80px rgba(0,0,0,.45);

}

body.light{

    --bg:#eef6ff;
    --card:rgba(255,255,255,.94);
    --text:#111827;
    --muted:#475569;
    --border:rgba(15,23,42,.15);
    --input:#f8fafc;
    --shadow:0 25px 80px rgba(15,23,42,.16);

}

/* ================= BODY ================= */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    color:var(--text);

    background:var(--bg);

    overflow:hidden;

    transition:.35s ease;

}

/* ================= BACKGROUND ================= */

.background{

    position:fixed;

    inset:0;

    overflow:hidden;

    z-index:-2;

}

.blur{

    position:absolute;

    width:400px;

    height:400px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.28;

    animation:moveBlur 12s infinite alternate ease-in-out;

}

.blur.one{

    background:#088aa4;

    top:-180px;

    left:-180px;

}

.blur.two{

    background:#260b54;

    right:-180px;

    bottom:-180px;

    animation-delay:2s;

}

.blur.three{

    background:#06b6d4;

    top:45%;

    left:42%;

    width:260px;

    height:260px;

    opacity:.12;

    animation-delay:4s;

}

@keyframes moveBlur{

    0%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(100px,80px) scale(1.2);
    }

    100%{
        transform:translate(-80px,120px) scale(.9);
    }

}

/* ================= PARTICLES ================= */

.particles{

    position:absolute;

    inset:0;

    pointer-events:none;

}

.particles span{

    position:absolute;

    width:4px;

    height:4px;

    border-radius:50%;

    background:#06b6d4;

    opacity:.5;

    animation:particleMove 10s linear infinite;

}

.particles span:nth-child(1){
    left:10%;
    top:20%;
}

.particles span:nth-child(2){
    left:25%;
    top:70%;
    animation-delay:3s;
}

.particles span:nth-child(3){
    left:50%;
    top:15%;
    animation-delay:2s;
}

.particles span:nth-child(4){
    left:75%;
    top:35%;
    animation-delay:4s;
}

.particles span:nth-child(5){
    left:90%;
    top:75%;
    animation-delay:1.5s;
}

.particles span:nth-child(6){
    left:60%;
    top:85%;
    animation-delay:5s;
}

@keyframes particleMove{

    0%{
        transform:translateY(0);
        opacity:.2;
    }

    50%{
        opacity:.8;
    }

    100%{
        transform:translateY(-120px);
        opacity:0;
    }

}

/* ================= THEME BUTTON ================= */

.theme-btn{

    position:fixed;

    top:18px;

    right:20px;

    width:42px;

    height:42px;

    border:1px solid var(--border);

    border-radius:11px;

    background:var(--card);

    color:var(--text);

    font-size:18px;

    cursor:pointer;

    box-shadow:var(--shadow);

    transition:.3s;

}

.theme-btn:hover{

    transform:rotate(15deg) scale(1.08);

    color:var(--primary);

}

/* ================= LOGIN CARD ================= */

.login-card{

    width:100%;

    max-width:390px;

    padding:28px 30px;

    border:1px solid var(--border);

    border-radius:20px;

    background:var(--card);

    backdrop-filter:blur(25px);

    box-shadow:var(--shadow);

    animation:cardShow .7s ease;

}

@keyframes cardShow{

    from{

        opacity:0;

        transform:translateY(25px) scale(.96);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}

/* ================= NEXA HUB AI ================= */

.logo{

    text-align:center;

    margin-bottom:20px;

}

.logo h1{

    font-size:23px;

    font-weight:800;

    letter-spacing:.5px;

    background:linear-gradient(
        90deg,
        #06b6d4,
        #7c3aed
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

}

.logo p{

    margin-top:5px;

    color:var(--muted);

    font-size:10px;

    font-weight:500;

}

/* ================= HEADING ================= */

.heading{

    text-align:center;

    margin-bottom:20px;

}

.heading h2{

    font-size:21px;

    font-weight:800;

}

.heading p{

    margin-top:5px;

    color:var(--muted);

    font-size:11px;

}

/* ================= FORM ================= */

.form-group{

    margin-bottom:14px;

}

.form-group label{

    display:block;

    margin-bottom:6px;

    font-size:11px;

    font-weight:700;

}

.input-box{

    position:relative;

}

.input-box > i{

    position:absolute;

    left:14px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:13px;

}

.input-box input{

    width:100%;

    height:44px;

    padding:0 42px;

    border:1px solid var(--border);

    border-radius:9px;

    outline:none;

    color:var(--text);

    background:var(--input);

    font-size:11px;

    transition:.3s;

}

.input-box input:focus{

    border-color:var(--primary);

    box-shadow:0 0 0 3px rgba(6,182,212,.12);

}

.password-toggle{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    cursor:pointer;

    font-size:13px;

}

/* ================= OPTIONS ================= */

.options{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:2px 0 16px;

    font-size:10px;

}

.remember{

    display:flex;

    align-items:center;

    gap:6px;

    color:var(--muted);

}

.remember input{

    accent-color:var(--primary);

}

.forgot{

    color:var(--primary);

    text-decoration:none;

    font-weight:600;

}

/* ================= LOGIN BUTTON ================= */

.login-btn{

    width:100%;

    height:44px;

    border:0;

    border-radius:9px;

    color:white;

    font-size:12px;

    font-weight:700;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #06b6d4,
        #7c3aed
    );

    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(6,182,212,.25);

}

/* ================= DIVIDER ================= */

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:18px 0;

    color:var(--muted);

    font-size:9px;

}

.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:var(--border);

}

/* ================= GOOGLE BUTTON ================= */

.google-btn{

    width:100%;

    height:43px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    border:1px solid var(--border);

    border-radius:9px;

    color:var(--text);

    background:transparent;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.google-btn:hover{

    background:rgba(66,133,244,.10);

    border-color:#4285F4;

    transform:translateY(-2px);

}

/* REAL GOOGLE LOGO */

.google-btn img{

    width:19px;

    height:19px;

    object-fit:contain;

}

/* ================= SIGNUP ================= */

.signup-text{

    margin-top:19px;

    text-align:center;

    color:var(--muted);

    font-size:10px;

}

.signup-text a{

    color:var(--primary);

    font-weight:700;

    text-decoration:none;

}

.signup-text a:hover{

    text-decoration:underline;

}

/* ================= SECURITY ================= */

.security{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    margin-top:15px;

    color:var(--muted);

    font-size:8px;

}

.security span{

    color:#22c55e;

    font-size:11px;

}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .login-card{

        max-width:360px;

        padding:25px 22px;

    }

    .logo h1{

        font-size:21px;

    }

    .heading h2{

        font-size:20px;

    }

    .theme-btn{

        top:12px;

        right:12px;

    }

}

</style>

</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="blur one"></div>

    <div class="blur two"></div>

    <div class="blur three"></div>

    <div class="particles">

        <span></span>

        <span></span>

        <span></span>

        <span></span>

        <span></span>

        <span></span>

    </div>

</div>

<!-- THEME BUTTON -->

<button
class="theme-btn"
id="themeBtn"
onclick="toggleTheme()">

    ☾

</button>

<!-- LOGIN CARD -->

<div class="login-card">

    <!-- NEXA HUB AI -->

    <div class="logo">

        <h1>NEXA HUB AI</h1>

        <p>Next Generation Intelligence</p>

    </div>

    <!-- HEADING -->

    <div class="heading">

        <h2>Welcome Back</h2>

        <p>Login to continue to your account</p>

    </div>

    <!-- LOGIN FORM -->

    <form onsubmit="loginUser(event)">

        <div class="form-group">

            <label>Email Address</label>

            <div class="input-box">

                <i>✉</i>

                <input
                type="email"
                placeholder="Enter your email"
                required>

            </div>

        </div>

        <div class="form-group">

            <label>Password</label>

            <div class="input-box">

                <i>🔒</i>

                <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>

                <span
                class="password-toggle"
                id="passwordIcon"
                onclick="togglePassword()">

                    👁

                </span>

            </div>

        </div>

        <div class="options">

            <label class="remember">

                <input type="checkbox">

                Remember me

            </label>

            <a
            href="forgot_password.html"
            class="forgot">

                Forgot Password?

            </a>

        </div>

        <button
        type="submit"
        class="login-btn">

            Login to Account

        </button>

    </form>

    <!-- DIVIDER -->

    <div class="divider">

        OR CONTINUE WITH

    </div>

    <!-- GOOGLE ONLY -->

    <button
    class="google-btn"
    onclick="googleLogin()">

        <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google Logo">

        Continue with Google

    </button>

    <!-- SIGNUP -->

    <div class="signup-text">

        Don't have an account?

        <a href="signup.html">

            Create Account

        </a>

    </div>

    <!-- SECURITY -->

    <div class="security">

        <span>🛡</span>

        Your information is securely protected

    </div>

</div>

<script>

/* ================= PASSWORD ================= */

function togglePassword(){

    const password =
    document.getElementById("password");

    const icon =
    document.getElementById("passwordIcon");

    if(password.type === "password"){

        password.type = "text";

        icon.innerHTML = "🙈";

    }else{

        password.type = "password";

        icon.innerHTML = "👁";

    }

}

/* ================= THEME ================= */

function toggleTheme(){

    document.body.classList.toggle("light");

    const btn =
    document.getElementById("themeBtn");

    if(
        document.body.classList.contains("light")
    ){

        btn.innerHTML = "☀";

        localStorage.setItem(
            "theme",
            "light"
        );

    }else{

        btn.innerHTML = "☾";

        localStorage.setItem(
            "theme",
            "dark"
        );

    }

}

/* ================= LOAD THEME ================= */

if(
    localStorage.getItem("theme")
    === "light"
){

    document.body.classList.add("light");

    document.getElementById(
        "themeBtn"
    ).innerHTML = "☀";

}

/* ================= LOGIN ================= */

function loginUser(event){

    event.preventDefault();

    alert("Login successful!");

}

/* ================= GOOGLE ================= */

function googleLogin(){

    alert(
        "Google Login will be connected with Google OAuth API."
    );

}

</script>

</body>

</html>
