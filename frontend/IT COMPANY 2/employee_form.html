<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Employee | NEXA HUB AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020617;
    --sidebar:#07122e;
    --card:#0f172a;
    --text:#ffffff;
    --muted:#94a3b8;
    --border:rgba(255,255,255,.08);
    --input:#020617;
    --primary:#06b6d4;
    --secondary:#4f46e5;
}

body.light{
    --bg:#f1f5f9;
    --sidebar:#ffffff;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#475569;
    --border:rgba(15,23,42,.12);
    --input:#f8fafc;
}

body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--text);
    background:var(--bg);
    transition:.4s;
}

/* ANIMATED BACKGROUND */

.animated-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.animated-bg span{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.20;
    animation:float 14s infinite alternate ease-in-out;
}

.animated-bg span:nth-child(1){
    background:#06b6d4;
    top:-150px;
    left:-100px;
}

.animated-bg span:nth-child(2){
    background:#7c3aed;
    right:-120px;
    top:20%;
    animation-delay:3s;
}

.animated-bg span:nth-child(3){
    background:#0891b2;
    bottom:-150px;
    left:30%;
    animation-delay:5s;
}

@keyframes float{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:translate(100px,70px);
    }

}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100vh;
    padding:25px 18px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:700;
    margin-bottom:35px;
}

.logo span{
    color:#06b6d4;
}

.nav-title{
    color:var(--muted);
    font-size:11px;
    margin:20px 12px 10px;
    text-transform:uppercase;
}

.nav a{
    display:flex;
    align-items:center;
    gap:13px;
    color:var(--muted);
    text-decoration:none;
    padding:13px 14px;
    border-radius:10px;
    margin:5px 0;
    transition:.3s;
}

.nav a:hover,
.nav a.active{
    color:#fff;
    background:linear-gradient(135deg,#0891b2,#4f46e5);
}

/* MAIN */

.main{
    margin-left:260px;
    padding:30px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:30px;
}

h1{
    font-size:28px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

.theme-toggle{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--border);
    cursor:pointer;
    font-size:17px;
}

/* FORM CARD */

.form-card{
    max-width:1100px;
    padding:28px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--border);
}

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
    padding-bottom:15px;
    border-bottom:1px solid var(--border);
}

.section-title i{
    color:var(--primary);
    font-size:20px;
}

.section-title h2{
    font-size:18px;
}

/* FORM GRID */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    margin-bottom:30px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    color:var(--muted);
    font-size:13px;
    font-weight:500;
}

input,
select,
textarea{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    color:var(--text);
    background:var(--input);
    font-family:'Poppins',sans-serif;
    transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(6,182,212,.12);
}

textarea{
    min-height:110px;
    resize:vertical;
}

/* BUTTONS */

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    padding-top:22px;
    border-top:1px solid var(--border);
}

.btn{
    border:none;
    padding:13px 22px;
    border-radius:10px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-cancel{
    color:var(--text);
    background:transparent;
    border:1px solid var(--border);
}

.btn-save{
    color:#fff;
    background:linear-gradient(135deg,#06b6d4,#4f46e5);
}

/* RESPONSIVE */

@media(max-width:800px){

    .sidebar{
        width:70px;
    }

    .logo{
        font-size:0;
    }

    .logo span{
        font-size:20px;
    }

    .nav a span,
    .nav-title{
        display:none;
    }

    .main{
        margin-left:70px;
        padding:20px;
    }

}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .form-card{
        padding:20px;
    }

    .form-actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="animated-bg">

    <span></span>
    <span></span>
    <span></span>

</div>

<aside class="sidebar">

    <div class="logo">

        NEXA <span>HUB AI</span>

    </div>

    <div class="nav-title">

        Main Menu

    </div>

    <nav class="nav">

        <a href="dashboard.html">

            <i class="fa-solid fa-chart-line"></i>

            <span>Dashboard</span>

        </a>

        <a href="employees.html" class="active">

            <i class="fa-solid fa-users"></i>

            <span>Employees</span>

        </a>

        <a href="departments.html">

            <i class="fa-solid fa-building"></i>

            <span>Departments</span>

        </a>

        <a href="designations.html">

            <i class="fa-solid fa-id-badge"></i>

            <span>Designations</span>

        </a>

    </nav>

    <div class="nav-title">

        System

    </div>

    <nav class="nav">

        <a href="documents.html">

            <i class="fa-solid fa-file"></i>

            <span>Documents</span>

        </a>

        <a href="403.html">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>Logout</span>

        </a>

    </nav>

</aside>

<main class="main">

    <div class="topbar">

        <div>

            <h1>Add Employee</h1>

            <div class="subtitle">

                Create a new employee profile

            </div>

        </div>

        <button class="theme-toggle" id="themeToggle">

            <i class="fa-solid fa-moon"></i>

        </button>

    </div>

    <div class="form-card">

        <div class="section-title">

            <i class="fa-solid fa-user"></i>

            <h2>Personal Information</h2>

        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>First Name</label>

                <input type="text" placeholder="Enter first name">

            </div>

            <div class="form-group">

                <label>Last Name</label>

                <input type="text" placeholder="Enter last name">

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input type="email" placeholder="Enter email address">

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input type="tel" placeholder="Enter phone number">

            </div>

            <div class="form-group">

                <label>Date of Birth</label>

                <input type="date">

            </div>

            <div class="form-group">

                <label>Gender</label>

                <select>

                    <option>Select Gender</option>

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                </select>

            </div>

        </div>

        <div class="section-title">

            <i class="fa-solid fa-briefcase"></i>

            <h2>Employment Information</h2>

        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>Employee ID</label>

                <input type="text" placeholder="EMP-0001">

            </div>

            <div class="form-group">

                <label>Joining Date</label>

                <input type="date">

            </div>

            <div class="form-group">

                <label>Department</label>

                <select>

                    <option>Select Department</option>

                    <option>Engineering</option>

                    <option>Marketing</option>

                    <option>Finance</option>

                    <option>Human Resources</option>

                    <option>Customer Support</option>

                </select>

            </div>

            <div class="form-group">

                <label>Designation</label>

                <select>

                    <option>Select Designation</option>

                    <option>Software Engineer</option>

                    <option>Senior Software Engineer</option>

                    <option>Product Manager</option>

                    <option>UI/UX Designer</option>

                    <option>HR Executive</option>

                </select>

            </div>

            <div class="form-group">

                <label>Employment Type</label>

                <select>

                    <option>Select Type</option>

                    <option>Full Time</option>

                    <option>Part Time</option>

                    <option>Contract</option>

                    <option>Intern</option>

                </select>

            </div>

            <div class="form-group">

                <label>Work Location</label>

                <input type="text" placeholder="Enter work location">

            </div>

            <div class="form-group full">

                <label>Address</label>

                <textarea placeholder="Enter complete address"></textarea>

            </div>

        </div>

        <div class="form-actions">

            <button class="btn btn-cancel">

                Cancel

            </button>

            <button class="btn btn-save">

                <i class="fa-solid fa-check"></i>

                Save Employee

            </button>

        </div>

    </div>

</main>

<script>

const themeToggle =
document.getElementById("themeToggle");

const icon =
themeToggle.querySelector("i");

function applyTheme(theme){

    if(theme === "light"){

        document.body.classList.add("light");

        icon.className =
        "fa-solid fa-sun";

    }

    else{

        document.body.classList.remove("light");

        icon.className =
        "fa-solid fa-moon";

    }

    localStorage.setItem(
        "nexaTheme",
        theme
    );

}

themeToggle.addEventListener(
    "click",
    function(){

        const theme =
        document.body.classList.contains("light")
        ? "dark"
        : "light";

        applyTheme(theme);

    }
);

applyTheme(
    localStorage.getItem("nexaTheme")
    || "dark"
);

</script>

</body>

</html>
