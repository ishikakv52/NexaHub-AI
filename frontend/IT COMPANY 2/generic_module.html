<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Module | NEXA HUB AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#020617;
    --sidebar:#07122e;
    --card:#0f172a;
    --card2:#111c35;
    --text:#ffffff;
    --muted:#94a3b8;
    --border:rgba(255,255,255,.08);
}

body.light{
    --bg:#f1f5f9;
    --sidebar:#ffffff;
    --card:#ffffff;
    --card2:#f8fafc;
    --text:#0f172a;
    --muted:#475569;
    --border:rgba(15,23,42,.12);
}

body{
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    color:var(--text);
    background:var(--bg);
    transition:.4s;
}

.animated-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.animated-bg span{
    position:absolute;
    width:360px;
    height:360px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.20;
    animation:float 15s infinite alternate ease-in-out;
}

.animated-bg span:nth-child(1){
    background:#06b6d4;
    top:-160px;
    left:-120px;
}

.animated-bg span:nth-child(2){
    background:#7c3aed;
    right:-150px;
    top:20%;
    animation-delay:3s;
}

.animated-bg span:nth-child(3){
    background:#0891b2;
    bottom:-180px;
    left:30%;
    animation-delay:5s;
}

@keyframes float{

    0%{
        transform:translate(0,0);
    }

    100%{
        transform:translate(100px,80px);
    }

}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:260px;
    height:100vh;
    padding:25px 18px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
}

.logo{
    font-size:22px;
    font-weight:800;
    margin-bottom:35px;
}

.logo span{
    color:#06b6d4;
}

.nav-title{
    color:var(--muted);
    font-size:11px;
    margin:20px 12px 10px;
    text-transform:uppercase;
}

.nav a{
    display:flex;
    align-items:center;
    gap:13px;
    color:var(--muted);
    text-decoration:none;
    padding:13px 14px;
    border-radius:10px;
    margin:5px 0;
    transition:.3s;
}

.nav a:hover,
.nav a.active{
    color:#fff;
    background:linear-gradient(135deg,#0891b2,#4f46e5);
}

.main{
    margin-left:260px;
    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

h1{
    font-size:28px;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
}

.theme-toggle{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    color:var(--text);
    background:var(--card);
    border:1px solid var(--border);
    cursor:pointer;
}

.module-card{
    padding:30px;
    border-radius:20px;
    background:var(--card);
    border:1px solid var(--border);
}

.module-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.module-header h2{
    font-size:20px;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    color:#fff;
    background:linear-gradient(135deg,#06b6d4,#4f46e5);
    font-family:'Poppins',sans-serif;
    font-weight:600;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.form-group label{
    color:var(--muted);
    font-size:13px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    color:var(--text);
    background:var(--card2);
    font-family:'Poppins',sans-serif;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

@media(max-width:800px){

    .sidebar{
        width:70px;
    }

    .logo{
        font-size:0;
        text-align:center;
    }

    .logo span{
        font-size:20px;
    }

    .nav a span,
    .nav-title{
        display:none;
    }

    .nav a{
        justify-content:center;
    }

    .main{
        margin-left:70px;
        padding:20px;
    }

}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .module-header{
        flex-direction:column;
        align-items:stretch;
        gap:15px;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="animated-bg">
    <span></span>
    <span></span>
    <span></span>
</div>

<aside class="sidebar">

    <div class="logo">
        NEXA <span>HUB AI</span>
    </div>

    <div class="nav-title">Main Menu</div>

    <nav class="nav">

        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
        </a>

        <a href="hr.html">
            <i class="fa-solid fa-users-gear"></i>
            <span>HR</span>
        </a>

        <a href="finance.html">
            <i class="fa-solid fa-wallet"></i>
            <span>Finance</span>
        </a>

        <a href="generic_module.html" class="active">
            <i class="fa-solid fa-cubes"></i>
            <span>Modules</span>
        </a>

    </nav>

    <div class="nav-title">System</div>

    <nav class="nav">

        <a href="documents.html">
            <i class="fa-solid fa-file"></i>
            <span>Documents</span>
        </a>

        <a href="activity_log.html">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Activity Log</span>
        </a>

    </nav>

</aside>

<main class="main">

    <div class="topbar">

        <div>

            <h1>Generic Module</h1>

            <div class="subtitle">
                Manage module information and records
            </div>

        </div>

        <button class="theme-toggle" id="themeToggle">

            <i class="fa-solid fa-moon"></i>

        </button>

    </div>

    <div class="module-card">

        <div class="module-header">

            <h2>Module Information</h2>

            <button class="btn">

                <i class="fa-solid fa-save"></i>

                Save Changes

            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>Module Name</label>

                <input
                type="text"
                placeholder="Enter module name">

            </div>

            <div class="form-group">

                <label>Status</label>

                <select>

                    <option>Active</option>
                    <option>Inactive</option>
                    <option>Pending</option>

                </select>

            </div>

            <div class="form-group">

                <label>Category</label>

                <select>

                    <option>General</option>
                    <option>Management</option>
                    <option>Operations</option>

                </select>

            </div>

            <div class="form-group">

                <label>Owner</label>

                <input
                type="text"
                placeholder="Enter owner name">

            </div>

            <div class="form-group full">

                <label>Description</label>

                <textarea
                placeholder="Write module description..."></textarea>

            </div>

        </div>

    </div>

</main>

<script>

const themeToggle =
document.getElementById("themeToggle");

const icon =
themeToggle.querySelector("i");

function applyTheme(theme){

    if(theme === "light"){

        document.body.classList.add("light");

        icon.className =
        "fa-solid fa-sun";

    }

    else{

        document.body.classList.remove("light");

        icon.className =
        "fa-solid fa-moon";

    }

    localStorage.setItem("nexaTheme",theme);

}

themeToggle.addEventListener("click",function(){

    const theme =
    document.body.classList.contains("light")
    ? "dark"
    : "light";

    applyTheme(theme);

});

applyTheme(
    localStorage.getItem("nexaTheme")
    || "dark"
);

</script>

</body>

</html>
