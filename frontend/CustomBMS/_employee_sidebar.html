<aside class="sidebar" id="sidebarNavEmp">
  <div class="sidebar-brand">
    <a href="{% url 'core:employee_dashboard' %}"><i class="fa-solid fa-id-badge"></i> {{ company_name }}</a>
  </div>
  <nav class="sidebar-nav">
    <a class="sidebar-link {% if request.resolver_match.url_name == 'employee_dashboard' %}active{% endif %}"
       href="{% url 'core:employee_dashboard' %}">
      <i class="fa-solid fa-gauge"></i><span>Dashboard</span>
    </a>
    <a class="sidebar-link {% if request.resolver_match.url_name == 'my_attendance' %}active{% endif %}"
       href="{% url 'core:my_attendance' %}">
      <i class="fa-solid fa-calendar-check"></i><span>My Attendance</span>
    </a>
    <a class="sidebar-link {% if request.resolver_match.url_name == 'my_salary' %}active{% endif %}"
       href="{% url 'core:my_salary' %}">
      <i class="fa-solid fa-money-check-dollar"></i><span>My Salary</span>
    </a>
  </nav>
</aside>

<header class="topbar">
  <button class="sidebar-toggle-btn d-lg-none" type="button" onclick="document.getElementById('sidebarNavEmp').classList.toggle('open')">
    <i class="fa-solid fa-bars"></i>
  </button>
  <div class="topbar-user">
    <span class="topbar-username"><i class="fa-solid fa-circle-user"></i> {{ user.username }}</span>
    <form method="post" action="{% url 'core:employee_logout' %}" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline-primary ms-2">Logout</button>
    </form>
  </div>
</header>
