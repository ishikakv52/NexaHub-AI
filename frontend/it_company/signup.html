<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · {{ company_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    body { background: linear-gradient(135deg, #101a2b, #1c2b45); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Roboto, Arial, sans-serif; padding: 2rem 0; }
    .auth-card { background: #fff; border-radius: 18px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
    .auth-card .brand { text-align: center; margin-bottom: 1.5rem; }
    .auth-card .brand i { font-size: 2.2rem; color: #4f7cff; }
    .btn-accent { background: #4f7cff; border-color: #4f7cff; }
    .btn-accent:hover { background: #3d68e8; border-color: #3d68e8; }
</style>
</head>
<body>
<div class="auth-card">
    <div class="brand">
        <i class="fas fa-cubes"></i>
        <h4 class="fw-bold mt-2 mb-0">Create Account</h4>
        <p class="text-muted small">Join the {{ company_name }} workspace</p>
    </div>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-accent w-100 text-white">Create Account</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
</body>
</html>
