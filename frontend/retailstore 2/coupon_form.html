<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA HUB AI | Coupon Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

:root{

    --bg:#080b14;
    --card:#101621;
    --sidebar:#0d111c;
    --border:#222d3e;
    --text:#ffffff;
    --muted:#8995a8;
    --input:#0a0f18;

}

body{

    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.3s ease;

}

body::before,
body::after{

    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.20;
    z-index:-1;

}

body::before{

    background:#00d4ff;
    top:-150px;
    left:-100px;
    animation:moveOne 12s infinite alternate;

}

body::after{

    background:#7c3aed;
    right:-150px;
    bottom:-150px;
    animation:moveTwo 15s infinite alternate;

}

@keyframes moveOne{

    to{

        transform:translate(180px,180px);

    }

}

@keyframes moveTwo{

    to{

        transform:translate(-180px,-150px);

    }

}

.app{

    display:flex;
    min-height:100vh;

}

.sidebar{

    width:250px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:25px 15px;
    position:fixed;
    top:0;
    bottom:0;

}

.logo{

    font-size:22px;
    font-weight:700;
    padding:10px 15px 30px;

}

.logo span{

    color:#00d4ff;

}

.nav-title{

    color:#748096;
    font-size:11px;
    text-transform:uppercase;
    margin:15px;

}

.sidebar a{

    display:flex;
    gap:12px;
    align-items:center;
    padding:12px 15px;
    margin:5px 0;
    border-radius:10px;
    text-decoration:none;
    color:#9ca8ba;
    font-size:13px;

}

.sidebar a:hover,
.sidebar a.active{

    background:#18263a;
    color:var(--text);

}

.sidebar a span{

    color:#00d4ff;

}

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    padding:30px;

}

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    padding-bottom:22px;
    margin-bottom:30px;

}

.breadcrumb{

    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;

}

.breadcrumb span{

    color:#00d4ff;

}

h1{

    font-size:28px;

}

.subtitle{

    color:var(--muted);
    font-size:13px;
    margin-top:5px;

}

.actions{

    display:flex;
    align-items:center;
    gap:12px;

}

.icon-btn{

    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:17px;

}

.user{

    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:10px;

}

.avatar{

    width:32px;
    height:32px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#00d4ff,#7c3aed);
    font-weight:bold;

}

.form-card{

    max-width:950px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:28px;

}

.form-card h2{

    font-size:18px;
    margin-bottom:25px;

}

.form-grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;

}

.form-group{

    display:flex;
    flex-direction:column;
    gap:8px;

}

.full{

    grid-column:1/-1;

}

label{

    color:var(--muted);
    font-size:12px;

}

input,
select{

    padding:13px 14px;
    background:var(--input);
    border:1px solid var(--border);
    border-radius:9px;
    color:var(--text);
    font-family:Poppins,sans-serif;
    outline:none;

}

input:focus,
select:focus{

    border-color:#00d4ff;

}

.form-actions{

    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid var(--border);

}

.cancel-btn,
.save-btn{

    padding:12px 25px;
    border-radius:9px;
    cursor:pointer;
    font-family:Poppins,sans-serif;

}

.cancel-btn{

    background:transparent;
    border:1px solid var(--border);
    color:var(--text);

}

.save-btn{

    border:none;
    background:linear-gradient(135deg,#00d4ff,#7c3aed);
    color:white;

}

body.light-mode{

    --bg:#f4f7fb;
    --card:#ffffff;
    --sidebar:#ffffff;
    --border:#dce3ec;
    --text:#172033;
    --muted:#64748b;
    --input:#ffffff;

}

body.light-mode .sidebar a{

    color:#64748b;

}

body.light-mode .sidebar a:hover,
body.light-mode .sidebar a.active{

    background:#e8f5ff;
    color:#172033;

}

body.light-mode .icon-btn,
body.light-mode .user{

    background:#ffffff;
    color:#172033;

}

body.light-mode .form-card{

    box-shadow:0 8px 25px rgba(30,50,80,.08);

}

body.light-mode input,
body.light-mode select{

    color:#172033;

}

body.light-mode .cancel-btn{

    color:#172033;

}

@media(max-width:800px){

    .form-grid{

        grid-template-columns:1fr;

    }

    .full{

        grid-column:auto;

    }

}

@media(max-width:700px){

    .sidebar{

        display:none;

    }

    .main{

        margin-left:0;
        width:100%;
        padding:20px;

    }

    .topbar{

        flex-direction:column;
        align-items:flex-start;
        gap:18px;

    }

    .form-actions{

        flex-direction:column;

    }

    .cancel-btn,
    .save-btn{

        width:100%;

    }

}

</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">

NEXA <span>HUB</span> AI

</div>

<div class="nav-title">

Business Management

</div>

<a href="dashboard.html">

<span>⌂</span>

Dashboard

</a>

<a href="product_list.html">

<span>▣</span>

Products

</a>

<a href="coupon_list.html" class="active">

<span>★</span>

Coupons

</a>

<a href="promotion_dashboard.html">

<span>◈</span>

Promotions

</a>

<a href="sale_list.html">

<span>▤</span>

Sales

</a>

<a href="customer_list.html">

<span>♙</span>

Customers

</a>

<a href="reports_insights.html">

<span>◉</span>

Reports

</a>

<a href="settings_business.html">

<span>⚙</span>

Settings

</a>

</aside>

<main class="main">

<div class="topbar">

<div>

<div class="breadcrumb">

Business Management /

<span>Coupon Form</span>

</div>

<h1>

Create Coupon

</h1>

<p class="subtitle">

Create a discount coupon for your customers.

</p>

</div>

<div class="actions">

<button class="icon-btn" id="themeToggle">☾</button>

<div class="user">

<div class="avatar">A</div>

<span>Admin</span>

</div>

</div>

</div>

<div class="form-card">

<h2>

Coupon Information

</h2>

<form id="couponForm">

<div class="form-grid">

<div class="form-group">

<label>Coupon Code</label>

<input

type="text"

placeholder="SAVE20"

required

>

</div>

<div class="form-group">

<label>Discount Type</label>

<select required>

<option value="">Select type</option>

<option>Percentage</option>

<option>Fixed Amount</option>

</select>

</div>

<div class="form-group">

<label>Discount Value</label>

<input

type="number"

placeholder="20"

required

>

</div>

<div class="form-group">

<label>Minimum Order Amount</label>

<input

type="number"

placeholder="100"

>

</div>

<div class="form-group">

<label>Start Date</label>

<input

type="date"

required

>

</div>

<div class="form-group">

<label>Expiry Date</label>

<input

type="date"

required

>

</div>

<div class="form-group">

<label>Usage Limit</label>

<input

type="number"

placeholder="100"

>

</div>

<div class="form-group">

<label>Status</label>

<select>

<option>Active</option>

<option>Inactive</option>

</select>

</div>

<div class="form-group full">

<label>Applicable Category</label>

<select>

<option>All Products</option>

<option>Electronics</option>

<option>Fashion</option>

<option>Home & Lifestyle</option>

</select>

</div>

</div>

<div class="form-actions">

<button

type="button"

class="cancel-btn"

onclick="history.back()"

>

Cancel

</button>

<button

type="submit"

class="save-btn"

>

Save Coupon

</button>

</div>

</form>

</div>

</main>

</div>

<script>

const themeToggle = document.getElementById("themeToggle");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "light"){

    document.body.classList.add("light-mode");

    themeToggle.textContent = "☀";

}

themeToggle.addEventListener("click",function(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        themeToggle.textContent = "☀";

        localStorage.setItem("theme","light");

    }else{

        themeToggle.textContent = "☾";

        localStorage.setItem("theme","dark");

    }

});

document.getElementById("couponForm")

.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Coupon saved successfully!");

});

</script>

</body>

</html>
