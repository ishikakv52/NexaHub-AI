<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA HUB AI | Confirm Delete</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

:root{

    --bg:#080b14;
    --card:#101621;
    --sidebar:#0d111c;
    --border:#222d3e;
    --text:#ffffff;
    --muted:#8995a8;

}

body{

    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.3s ease;

}

body::before,
body::after{

    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.20;
    z-index:-1;

}

body::before{

    background:#00d4ff;
    top:-150px;
    left:-100px;
    animation:moveOne 12s infinite alternate;

}

body::after{

    background:#7c3aed;
    right:-150px;
    bottom:-150px;
    animation:moveTwo 15s infinite alternate;

}

@keyframes moveOne{

    to{

        transform:translate(180px,180px);

    }

}

@keyframes moveTwo{

    to{

        transform:translate(-180px,-150px);

    }

}

.app{

    display:flex;
    min-height:100vh;

}

.sidebar{

    width:250px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:25px 15px;
    position:fixed;
    top:0;
    bottom:0;

}

.logo{

    font-size:22px;
    font-weight:700;
    padding:10px 15px 30px;

}

.logo span{

    color:#00d4ff;

}

.nav-title{

    color:#748096;
    font-size:11px;
    text-transform:uppercase;
    margin:15px;

}

.sidebar a{

    display:flex;
    gap:12px;
    align-items:center;
    padding:12px 15px;
    margin:5px 0;
    border-radius:10px;
    text-decoration:none;
    color:#9ca8ba;
    font-size:13px;

}

.sidebar a:hover,
.sidebar a.active{

    background:#18263a;
    color:var(--text);

}

.sidebar a span{

    color:#00d4ff;

}

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    padding:30px;

}

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    padding-bottom:22px;
    margin-bottom:30px;

}

.breadcrumb{

    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;

}

.breadcrumb span{

    color:#00d4ff;

}

h1{

    font-size:28px;

}

.subtitle{

    color:var(--muted);
    font-size:13px;
    margin-top:5px;

}

.actions{

    display:flex;
    align-items:center;
    gap:12px;

}

.icon-btn{

    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:17px;

}

.user{

    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:10px;

}

.avatar{

    width:32px;
    height:32px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#00d4ff,#7c3aed);
    font-weight:bold;

}

.delete-box{

    max-width:550px;
    margin:80px auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:40px;
    text-align:center;

}

.delete-icon{

    width:75px;
    height:75px;
    margin:0 auto 20px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#3a2028;
    color:#ff7186;
    font-size:34px;

}

.delete-box h2{

    font-size:22px;
    margin-bottom:12px;

}

.delete-box p{

    color:var(--muted);
    font-size:13px;
    line-height:1.7;
    margin-bottom:28px;

}

.delete-actions{

    display:flex;
    justify-content:center;
    gap:12px;

}

.cancel-btn,
.delete-btn{

    padding:12px 25px;
    border-radius:9px;
    cursor:pointer;
    font-family:Poppins,sans-serif;

}

.cancel-btn{

    background:transparent;
    border:1px solid var(--border);
    color:var(--text);

}

.delete-btn{

    border:none;
    background:#e63956;
    color:white;

}

body.light-mode{

    --bg:#f4f7fb;
    --card:#ffffff;
    --sidebar:#ffffff;
    --border:#dce3ec;
    --text:#172033;
    --muted:#64748b;

}

body.light-mode .sidebar a{

    color:#64748b;

}

body.light-mode .sidebar a:hover,
body.light-mode .sidebar a.active{

    background:#e8f5ff;
    color:#172033;

}

body.light-mode .icon-btn,
body.light-mode .user{

    background:#ffffff;
    color:#172033;

}

body.light-mode .delete-box{

    box-shadow:0 8px 25px rgba(30,50,80,.08);

}

body.light-mode .cancel-btn{

    color:#172033;

}

@media(max-width:700px){

    .sidebar{

        display:none;

    }

    .main{

        margin-left:0;
        width:100%;
        padding:20px;

    }

    .topbar{

        flex-direction:column;
        align-items:flex-start;
        gap:18px;

    }

    .delete-box{

        margin:40px auto;
        padding:30px 20px;

    }

    .delete-actions{

        flex-direction:column;

    }

    .cancel-btn,
    .delete-btn{

        width:100%;

    }

}

</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">

NEXA <span>HUB</span> AI

</div>

<div class="nav-title">

Business Management

</div>

<a href="dashboard.html">

<span>⌂</span>

Dashboard

</a>

<a href="product_list.html">

<span>▣</span>

Products

</a>

<a href="customer_list.html">

<span>♙</span>

Customers

</a>

<a href="sale_list.html">

<span>▤</span>

Sales

</a>

<a href="reports_insights.html">

<span>◉</span>

Reports

</a>

<a href="settings_business.html">

<span>⚙</span>

Settings

</a>

</aside>

<main class="main">

<div class="topbar">

<div>

<div class="breadcrumb">

Business Management /

<span>Confirm Delete</span>

</div>

<h1>

Confirm Delete

</h1>

<p class="subtitle">

Please confirm this action before continuing.

</p>

</div>

<div class="actions">

<button class="icon-btn" id="themeToggle">☾</button>

<div class="user">

<div class="avatar">A</div>

<span>Admin</span>

</div>

</div>

</div>

<div class="delete-box">

<div class="delete-icon">

!

</div>

<h2>

Delete This Item?

</h2>

<p>

Are you sure you want to delete this item?

This action cannot be undone.

</p>

<div class="delete-actions">

<button class="cancel-btn" onclick="history.back()">

Cancel

</button>

<button class="delete-btn" onclick="confirmDelete()">

Yes, Delete

</button>

</div>

</div>

</main>

</div>

<script>

const themeToggle = document.getElementById("themeToggle");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "light"){

    document.body.classList.add("light-mode");

    themeToggle.textContent = "☀";

}

themeToggle.addEventListener("click",function(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        themeToggle.textContent = "☀";

        localStorage.setItem("theme","light");

    }else{

        themeToggle.textContent = "☾";

        localStorage.setItem("theme","dark");

    }

});

function confirmDelete(){

    alert("Item deleted successfully!");

    history.back();

}

</script>

</body>

</html>
