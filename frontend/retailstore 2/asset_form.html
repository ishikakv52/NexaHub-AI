<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA HUB AI | Asset Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#080b14;
    --card:#101621;
    --sidebar:#0d111c;
    --border:#222d3e;
    --text:#ffffff;
    --muted:#8995a8;
    --input:#0a0f18;

}

body{

    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition:.3s ease;

}

/* ANIMATED BACKGROUND */

body::before,
body::after{

    content:"";
    position:fixed;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.20;
    z-index:-1;
    pointer-events:none;

}

body::before{

    background:#00d4ff;
    top:-150px;
    left:-100px;
    animation:moveOne 12s infinite alternate ease-in-out;

}

body::after{

    background:#7c3aed;
    right:-150px;
    bottom:-150px;
    animation:moveTwo 15s infinite alternate ease-in-out;

}

@keyframes moveOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(180px,180px);
    }

}

@keyframes moveTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-180px,-150px);
    }

}

/* LAYOUT */

.app{

    display:flex;
    min-height:100vh;

}

/* SIDEBAR */

.sidebar{

    width:250px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:25px 15px;
    position:fixed;
    top:0;
    bottom:0;

}

.logo{

    font-size:22px;
    font-weight:700;
    padding:10px 15px 30px;

}

.logo span{

    color:#00d4ff;

}

.nav-title{

    color:#748096;
    font-size:11px;
    text-transform:uppercase;
    margin:15px;

}

.sidebar a{

    display:flex;
    gap:12px;
    align-items:center;
    padding:12px 15px;
    margin:5px 0;
    border-radius:10px;
    text-decoration:none;
    color:#9ca8ba;
    font-size:13px;
    transition:.3s;

}

.sidebar a:hover,
.sidebar a.active{

    background:#18263a;
    color:var(--text);

}

.sidebar a span{

    color:#00d4ff;

}

/* MAIN */

.main{

    margin-left:250px;
    width:calc(100% - 250px);
    padding:30px;

}

/* TOPBAR */

.topbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    padding-bottom:22px;
    margin-bottom:30px;

}

.breadcrumb{

    color:var(--muted);
    font-size:12px;
    margin-bottom:8px;

}

.breadcrumb span{

    color:#00d4ff;

}

h1{

    font-size:28px;

}

.subtitle{

    color:var(--muted);
    font-size:13px;
    margin-top:5px;

}

.actions{

    display:flex;
    align-items:center;
    gap:12px;

}

.icon-btn{

    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-size:17px;

}

.user{

    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    padding:7px 12px;
    border-radius:10px;

}

.avatar{

    width:32px;
    height:32px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(
        135deg,
        #00d4ff,
        #7c3aed
    );
    font-weight:bold;

}

/* FORM */

.form-card{

    max-width:1000px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:15px;
    padding:28px;

}

.form-card h2{

    font-size:18px;
    margin-bottom:25px;

}

.form-grid{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;

}

.form-group{

    display:flex;
    flex-direction:column;
    gap:8px;

}

.form-group.full{

    grid-column:1/-1;

}

label{

    color:var(--muted);
    font-size:12px;

}

input,
select,
textarea{

    width:100%;
    padding:13px 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    font-family:Poppins,sans-serif;
    outline:none;

}

input:focus,
select:focus,
textarea:focus{

    border-color:#00d4ff;

}

textarea{

    min-height:110px;
    resize:vertical;

}

/* BUTTONS */

.form-actions{

    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid var(--border);

}

.cancel-btn{

    padding:12px 22px;
    border:1px solid var(--border);
    border-radius:9px;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-family:Poppins,sans-serif;

}

.save-btn{

    padding:12px 25px;
    border:none;
    border-radius:9px;
    background:linear-gradient(
        135deg,
        #00d4ff,
        #7c3aed
    );
    color:white;
    cursor:pointer;
    font-family:Poppins,sans-serif;

}

/* LIGHT MODE */

body.light-mode{

    --bg:#f4f7fb;
    --card:#ffffff;
    --sidebar:#ffffff;
    --border:#dce3ec;
    --text:#172033;
    --muted:#64748b;
    --input:#ffffff;

}

body.light-mode .sidebar a{

    color:#64748b;

}

body.light-mode .sidebar a:hover,
body.light-mode .sidebar a.active{

    background:#e8f5ff;
    color:#172033;

}

body.light-mode .icon-btn,
body.light-mode .user{

    background:#ffffff;
    color:#172033;

}

body.light-mode .form-card{

    box-shadow:0 8px 25px rgba(30,50,80,.08);

}

body.light-mode input,
body.light-mode select,
body.light-mode textarea{

    background:#ffffff;
    color:#172033;

}

body.light-mode .cancel-btn{

    color:#172033;

}

/* RESPONSIVE */

@media(max-width:800px){

    .form-grid{

        grid-template-columns:1fr;

    }

    .form-group.full{

        grid-column:auto;

    }

}

@media(max-width:700px){

    .sidebar{

        display:none;

    }

    .main{

        margin-left:0;
        width:100%;
        padding:20px;

    }

    .topbar{

        flex-direction:column;
        align-items:flex-start;
        gap:18px;

    }

    .form-actions{

        flex-direction:column;

    }

    .cancel-btn,
    .save-btn{

        width:100%;

    }

}

</style>

</head>

<script>

const themeToggle =

document.getElementById("themeToggle");

const savedTheme =

localStorage.getItem("theme");

if(savedTheme === "light"){

    document.body.classList.add("light-mode");

    themeToggle.textContent = "☀";

}

themeToggle.addEventListener("click",function(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        themeToggle.textContent = "☀";

        localStorage.setItem("theme","light");

    }else{

        themeToggle.textContent = "☾";

        localStorage.setItem("theme","dark");

    }

});

document.getElementById("assetForm")

.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Asset saved successfully!");

});

</script>
