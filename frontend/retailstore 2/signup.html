<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA HUB AI | Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#080b14;
    --card:#101621;
    --border:#222d3e;
    --text:#ffffff;
    --muted:#8995a8;
    --input:#0a0f18;

}

body{

    font-family:Poppins,sans-serif;

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    overflow-x:hidden;

    transition:.3s ease;

}

/* ANIMATED BACKGROUND */

body::before,
body::after{

    content:"";

    position:fixed;

    width:400px;

    height:400px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.20;

    z-index:-1;

    pointer-events:none;

}

body::before{

    background:#00d4ff;

    top:-180px;

    left:-150px;

    animation:moveOne 12s infinite alternate ease-in-out;

}

body::after{

    background:#7c3aed;

    right:-150px;

    bottom:-180px;

    animation:moveTwo 15s infinite alternate ease-in-out;

}

@keyframes moveOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(180px,180px);
    }

}

@keyframes moveTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-180px,-150px);
    }

}

/* THEME BUTTON */

.theme-toggle{

    position:fixed;

    top:18px;

    right:18px;

    width:40px;

    height:40px;

    border-radius:50%;

    border:1px solid var(--border);

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    font-size:17px;

    transition:.3s;

}

.theme-toggle:hover{

    border-color:#00d4ff;

    transform:rotate(15deg);

}

/* SIGNUP CARD */

.signup-card{

    width:100%;

    max-width:360px;

    background:rgba(16,22,33,.95);

    border:1px solid var(--border);

    border-radius:16px;

    padding:20px 22px;

    box-shadow:0 20px 60px rgba(0,0,0,.35);

    backdrop-filter:blur(15px);

    animation:cardShow .7s ease;

}

@keyframes cardShow{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

/* LOGO */

.logo{

    text-align:center;

    font-size:20px;

    font-weight:700;

    margin-bottom:4px;

}

.logo span{

    color:#00d4ff;

}

/* HEADING */

.heading{

    text-align:center;

    font-size:18px;

    margin-top:10px;

}

.subtitle{

    text-align:center;

    color:var(--muted);

    font-size:10px;

    margin-top:5px;

    margin-bottom:15px;

}

/* FORM */

.form-group{

    margin-bottom:10px;

}

.form-group label{

    display:block;

    color:var(--muted);

    font-size:10px;

    margin-bottom:4px;

}

.form-group input{

    width:100%;

    padding:9px 11px;

    border-radius:7px;

    border:1px solid var(--border);

    background:var(--input);

    color:var(--text);

    font-family:Poppins,sans-serif;

    font-size:11px;

    outline:none;

    transition:.3s;

}

.form-group input:focus{

    border-color:#00d4ff;

    box-shadow:0 0 0 3px rgba(0,212,255,.08);

}

/* PASSWORD */

.password-box{

    position:relative;

}

.password-box input{

    padding-right:40px;

}

.show-password{

    position:absolute;

    right:11px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:var(--muted);

    font-size:14px;

    user-select:none;

}

.show-password:hover{

    color:#00d4ff;

}

/* TERMS */

.terms{

    display:flex;

    align-items:flex-start;

    gap:7px;

    color:var(--muted);

    font-size:9px;

    line-height:1.5;

    margin:12px 0;

}

.terms input{

    margin-top:2px;

    accent-color:#00d4ff;

}

.terms a{

    color:#00d4ff;

    text-decoration:none;

}

/* SIGNUP BUTTON */

.signup-btn{

    width:100%;

    padding:10px;

    border:none;

    border-radius:7px;

    background:linear-gradient(

        135deg,

        #00d4ff,

        #7c3aed

    );

    color:white;

    font-family:Poppins,sans-serif;

    font-size:11px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.signup-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 20px rgba(0,212,255,.18);

}

/* DIVIDER */

.divider{

    display:flex;

    align-items:center;

    gap:9px;

    color:var(--muted);

    font-size:9px;

    margin:15px 0;

}

.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:var(--border);

}

/* GOOGLE BUTTON */

.social-buttons{

    display:grid;

    grid-template-columns:1fr;

}

.social-btn{

    width:100%;

    padding:8px;

    border-radius:7px;

    border:1px solid var(--border);

    background:transparent;

    color:var(--text);

    cursor:pointer;

    font-family:Poppins,sans-serif;

    font-size:10px;

    transition:.3s;

}

.social-btn:hover{

    border-color:#00d4ff;

    background:rgba(0,212,255,.05);

    transform:translateY(-2px);

}

.google-btn{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

}

.google-logo{

    width:16px;

    height:16px;

}

/* LOGIN */

.login-text{

    text-align:center;

    color:var(--muted);

    font-size:10px;

    margin-top:14px;

}

.login-text a{

    color:#00d4ff;

    text-decoration:none;

    font-weight:500;

}

/* LIGHT MODE */

body.light-mode{

    --bg:#f4f7fb;

    --card:#ffffff;

    --border:#dce3ec;

    --text:#172033;

    --muted:#64748b;

    --input:#ffffff;

}

body.light-mode .signup-card{

    background:rgba(255,255,255,.95);

    box-shadow:0 20px 60px rgba(30,50,80,.12);

}

body.light-mode .theme-toggle{

    background:#ffffff;

    color:#172033;

}

body.light-mode .social-btn{

    color:#172033;

}

/* RESPONSIVE */

@media(max-width:500px){

    body{

        padding:12px;

    }

    .signup-card{

        max-width:340px;

        padding:18px 18px;

    }

    .theme-toggle{

        top:12px;

        right:12px;

    }

}

</style>

</head>

<body>

<!-- THEME TOGGLE -->

<button

    class="theme-toggle"

    id="themeToggle"

>

    ☾

</button>

<!-- SIGNUP CARD -->

<div class="signup-card">

    <div class="logo">

        NEXA <span>HUB</span> AI

    </div>

    <h1 class="heading">

        Create Your Account

    </h1>

    <p class="subtitle">

        Join NEXA HUB AI and manage your retail business smarter.

    </p>

    <form id="signupForm">

        <!-- FULL NAME -->

        <div class="form-group">

            <label>

                Full Name

            </label>

            <input

                type="text"

                placeholder="Enter your full name"

                required

            >

        </div>

        <!-- EMAIL -->

        <div class="form-group">

            <label>

                Email Address

            </label>

            <input

                type="email"

                placeholder="Enter your email"

                required

            >

        </div>

        <!-- USERNAME -->

        <div class="form-group">

            <label>

                Username

            </label>

            <input

                type="text"

                placeholder="Create a username"

                required

            >

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

            <label>

                Password

            </label>

            <div class="password-box">

                <input

                    type="password"

                    id="password"

                    placeholder="Create a password"

                    required

                >

                <span

                    class="show-password"

                    onclick="togglePassword('password',this)"

                >

                    ◉

                </span>

            </div>

        </div>

        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label>

                Confirm Password

            </label>

            <div class="password-box">

                <input

                    type="password"

                    id="confirmPassword"

                    placeholder="Confirm your password"

                    required

                >

                <span

                    class="show-password"

                    onclick="togglePassword('confirmPassword',this)"

                >

                    ◉

                </span>

            </div>

        </div>

        <!-- TERMS -->

        <div class="terms">

            <input

                type="checkbox"

                required

            >

            <span>

                I agree to the

                <a href="#">

                    Terms of Service

                </a>

                and

                <a href="#">

                    Privacy Policy

                </a>

            </span>

        </div>

        <!-- CREATE ACCOUNT -->

        <button

            type="submit"

            class="signup-btn"

        >

            Create Account

        </button>

    </form>

    <!-- DIVIDER -->

    <div class="divider">

        OR SIGN UP WITH

    </div>

    <!-- GOOGLE ONLY -->

    <div class="social-buttons">

        <button

            type="button"

            class="social-btn google-btn"

        >

            <svg

                class="google-logo"

                viewBox="0 0 24 24"

            >

                <path

                    fill="#4285F4"

                    d="M21.35 12.27c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"

                />

                <path

                    fill="#34A853"

                    d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.5z"

                />

                <path

                    fill="#FBBC05"

                    d="M6.54 13.58A5.86 5.86 0 0 1 6.23 12c0-.55.1-1.08.31-1.58V7.89H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.11l3.24-2.53z"

                />

                <path

                    fill="#EA4335"

                    d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.47 14.63 2.5 12 2.5a9.75 9.75 0 0 0-8.7 5.39l3.24 2.53C7.31 8.11 9.46 6.39 12 6.39z"

                />

            </svg>

            Continue with Google

        </button>

    </div>

    <!-- LOGIN -->

    <p class="login-text">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

</div>

<script>

/* THEME */

const themeToggle = document.getElementById(

    "themeToggle"

);

const savedTheme = localStorage.getItem(

    "theme"

);

if(savedTheme === "light"){

    document.body.classList.add(

        "light-mode"

    );

    themeToggle.textContent = "☀";

}

themeToggle.addEventListener(

    "click",

    function(){

        document.body.classList.toggle(

            "light-mode"

        );

        if(

            document.body.classList.contains(

                "light-mode"

            )

        ){

            themeToggle.textContent = "☀";

            localStorage.setItem(

                "theme",

                "light"

            );

        }

        else{

            themeToggle.textContent = "☾";

            localStorage.setItem(

                "theme",

                "dark"

            );

        }

    }

);

/* SHOW / HIDE PASSWORD */

function togglePassword(

    id,

    icon

){

    const input = document.getElementById(

        id

    );

    if(

        input.type === "password"

    ){

        input.type = "text";

    }

    else{

        input.type = "password";

    }

}

/* SIGNUP VALIDATION */

document

    .getElementById("signupForm")

    .addEventListener(

        "submit",

        function(event){

            event.preventDefault();

            const password =

                document.getElementById(

                    "password"

                ).value;

            const confirmPassword =

                document.getElementById(

                    "confirmPassword"

                ).value;

            if(

                password !== confirmPassword

            ){

                alert(

                    "Passwords do not match!"

                );

                return;

            }

            alert(

                "Account created successfully!"

            );

            window.location.href =

                "portal_dashboard.html";

        }

    );

</script>

</body>

</html>
