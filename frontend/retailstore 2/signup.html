<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA HUB AI | Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#080b14;
    --card:#101621;
    --border:#222d3e;
    --text:#ffffff;
    --muted:#8995a8;
    --input:#0a0f18;

}

body{

    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--text);

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow-x:hidden;

    transition:.3s ease;

}

/* ANIMATED BACKGROUND */

body::before,
body::after{

    content:"";

    position:fixed;

    width:380px;
    height:380px;

    border-radius:50%;

    filter:blur(110px);

    opacity:.20;

    z-index:-1;

    pointer-events:none;

}

body::before{

    background:#00d4ff;

    top:-150px;
    left:-100px;

    animation:moveOne 12s infinite alternate ease-in-out;

}

body::after{

    background:#7c3aed;

    right:-150px;
    bottom:-150px;

    animation:moveTwo 15s infinite alternate ease-in-out;

}

@keyframes moveOne{

    from{

        transform:translate(0,0);

    }

    to{

        transform:translate(150px,150px);

    }

}

@keyframes moveTwo{

    from{

        transform:translate(0,0);

    }

    to{

        transform:translate(-150px,-120px);

    }

}

/* THEME BUTTON */

.theme-toggle{

    position:fixed;

    top:18px;
    right:18px;

    width:38px;
    height:38px;

    border-radius:9px;

    border:1px solid var(--border);

    background:var(--card);

    color:var(--text);

    cursor:pointer;

    font-size:17px;

}

/* SIGNUP CARD */

.signup-card{

    width:100%;

    max-width:390px;

    margin:15px;

    padding:25px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;

    box-shadow:0 20px 60px rgba(0,0,0,.25);

}

/* LOGO */

.logo{

    text-align:center;

    font-size:22px;

    font-weight:700;

    margin-bottom:6px;

}

.logo span{

    color:#00d4ff;

}

/* HEADING */

.heading{

    text-align:center;

    margin-bottom:20px;

}

.heading h1{

    font-size:23px;

    margin-bottom:5px;

}

.heading p{

    color:var(--muted);

    font-size:12px;

}

/* FORM */

.form-group{

    display:flex;

    flex-direction:column;

    gap:5px;

    margin-bottom:12px;

}

label{

    color:var(--muted);

    font-size:12px;

}

input{

    width:100%;

    padding:11px 12px;

    border-radius:8px;

    border:1px solid var(--border);

    background:var(--input);

    color:var(--text);

    font-family:Poppins,sans-serif;

    font-size:12px;

    outline:none;

    transition:.3s;

}

input:focus{

    border-color:#00d4ff;

    box-shadow:0 0 0 2px rgba(0,212,255,.08);

}

/* PASSWORD */

.password-box{

    position:relative;

}

.password-box input{

    padding-right:42px;

}

.password-toggle{

    position:absolute;

    right:12px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:transparent;

    color:var(--muted);

    cursor:pointer;

    font-size:14px;

}

/* TERMS */

.terms{

    display:flex;

    align-items:flex-start;

    gap:7px;

    margin:13px 0;

    color:var(--muted);

    font-size:10px;

    line-height:1.5;

}

.terms input{

    width:auto;

    margin-top:3px;

}

.terms a{

    color:#00d4ff;

    text-decoration:none;

}

/* BUTTON */

.signup-btn{

    width:100%;

    padding:11px;

    border:none;

    border-radius:8px;

    background:linear-gradient(

        135deg,

        #00d4ff,

        #7c3aed

    );

    color:white;

    cursor:pointer;

    font-family:Poppins,sans-serif;

    font-size:13px;

    font-weight:600;

    transition:.3s;

}

.signup-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 8px 20px rgba(0,212,255,.18);

}

/* LOGIN */

.login-text{

    text-align:center;

    color:var(--muted);

    font-size:11px;

    margin-top:15px;

}

.login-text a{

    color:#00d4ff;

    text-decoration:none;

    font-weight:600;

}

/* LIGHT MODE */

body.light-mode{

    --bg:#f4f7fb;

    --card:#ffffff;

    --border:#dce3ec;

    --text:#172033;

    --muted:#334155;

    --input:#ffffff;

}

body.light-mode .signup-card{

    box-shadow:0 15px 40px rgba(30,50,80,.12);

}

body.light-mode input{

    background:#ffffff;

    color:#172033;

}

body.light-mode .theme-toggle{

    background:#ffffff;

    color:#172033;

}

/* RESPONSIVE */

@media(max-width:500px){

    .signup-card{

        max-width:350px;

        padding:22px 18px;

        margin:12px;

    }

    .heading h1{

        font-size:21px;

    }

}

</style>

</head>

<body>

<!-- THEME BUTTON -->

<button

class="theme-toggle"

id="themeToggle"

>

☾

</button>

<!-- SIGNUP CARD -->

<div class="signup-card">

<div class="logo">

NEXA <span>HUB</span> AI

</div>

<div class="heading">

<h1>

Create Account

</h1>

<p>

Join NEXA HUB AI and manage your business smarter.

</p>

</div>

<form id="signupForm">

<div class="form-group">

<label>

Full Name

</label>

<input

type="text"

placeholder="Enter your full name"

required

>

</div>

<div class="form-group">

<label>

Email Address

</label>

<input

type="email"

placeholder="Enter your email address"

required

>

</div>

<div class="form-group">

<label>

Username

</label>

<input

type="text"

placeholder="Choose a username"

required

>

</div>

<div class="form-group">

<label>

Password

</label>

<div class="password-box">

<input

type="password"

id="password"

placeholder="Create a password"

required

>

<button

type="button"

class="password-toggle"

onclick="togglePassword('password',this)"

>

👁

</button>

</div>

</div>

<div class="form-group">

<label>

Confirm Password

</label>

<div class="password-box">

<input

type="password"

id="confirmPassword"

placeholder="Confirm your password"

required

>

<button

type="button"

class="password-toggle"

onclick="togglePassword('confirmPassword',this)"

>

👁

</button>

</div>

</div>

<div class="terms">

<input

type="checkbox"

required

>

<span>

I agree to the

<a href="#">

Terms & Conditions

</a>

and

<a href="#">

Privacy Policy

</a>

</span>

</div>

<button

type="submit"

class="signup-btn"

>

Create Account

</button>

</form>

<div class="login-text">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script>

/* THEME */

const themeToggle = document.getElementById("themeToggle");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "light"){

    document.body.classList.add("light-mode");

    themeToggle.textContent = "☀";

}

themeToggle.addEventListener("click",function(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        themeToggle.textContent = "☀";

        localStorage.setItem("theme","light");

    }

    else{

        themeToggle.textContent = "☾";

        localStorage.setItem("theme","dark");

    }

});

/* PASSWORD TOGGLE */

function togglePassword(id,button){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }

    else{

        input.type = "password";

        button.textContent = "👁";

    }

}

/* SIGNUP */

document

.getElementById("signupForm")

.addEventListener("submit",function(e){

    e.preventDefault();

    const password = document

    .getElementById("password")

    .value;

    const confirmPassword = document

    .getElementById("confirmPassword")

    .value;

    if(password !== confirmPassword){

        alert("Passwords do not match!");

        return;

    }

    alert("Account created successfully!");

});

</script>

</body>

</html>
