<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXA HUB AI | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#080b14;
    --card:#101621;
    --border:#222d3e;
    --text:#ffffff;
    --muted:#8995a8;
    --input:#0a0f18;

}

body{

    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:.3s ease;

}

/* ANIMATED BACKGROUND */

body::before,
body::after{

    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.22;
    z-index:-1;
    pointer-events:none;

}

body::before{

    background:#00d4ff;
    top:-180px;
    left:-150px;
    animation:moveOne 12s infinite alternate ease-in-out;

}

body::after{

    background:#7c3aed;
    right:-180px;
    bottom:-180px;
    animation:moveTwo 15s infinite alternate ease-in-out;

}

@keyframes moveOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(200px,180px);
    }

}

@keyframes moveTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-180px,-160px);
    }

}

/* LOGIN CARD */

.login-card{

    width:100%;
    max-width:450px;
    margin:20px;
    padding:38px;
    background:rgba(16,22,33,.92);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 25px 80px rgba(0,0,0,.35);
    backdrop-filter:blur(15px);

}

.logo{

    text-align:center;
    font-size:26px;
    font-weight:700;
    margin-bottom:10px;

}

.logo span{

    color:#00d4ff;

}

.heading{

    text-align:center;
    margin-bottom:30px;

}

.heading h1{

    font-size:30px;
    margin-bottom:8px;

}

.heading p{

    color:var(--muted);
    font-size:15px;

}

/* FORM */

.form-group{

    margin-bottom:20px;

}

label{

    display:block;
    color:var(--muted);
    font-size:14px;
    margin-bottom:8px;

}

input{

    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    font-family:Poppins,sans-serif;
    font-size:15px;
    outline:none;

}

input:focus{

    border-color:#00d4ff;

}

.password-box{

    position:relative;

}

.password-box input{

    padding-right:50px;

}

.password-toggle{

    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:var(--muted);
    font-size:18px;

}

/* OPTIONS */

.options{

    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:5px 0 25px;
    font-size:13px;

}

.remember{

    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);

}

.remember input{

    width:auto;

}

.forgot{

    color:#00d4ff;
    text-decoration:none;

}

/* BUTTON */

.login-btn{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(
        135deg,
        #00d4ff,
        #7c3aed
    );
    color:white;
    font-family:Poppins,sans-serif;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,212,255,.2);

}

/* DIVIDER */

.divider{

    display:flex;
    align-items:center;
    gap:12px;
    margin:25px 0;
    color:var(--muted);
    font-size:13px;

}

.divider::before,
.divider::after{

    content:"";
    height:1px;
    flex:1;
    background:var(--border);

}

/* SIGNUP */

.signup-text{

    text-align:center;
    color:var(--muted);
    font-size:14px;

}

.signup-text a{

    color:#00d4ff;
    text-decoration:none;
    font-weight:600;

}

/* LIGHT MODE */

body.light-mode{

    --bg:#f4f7fb;
    --card:#ffffff;
    --border:#dce3ec;
    --text:#172033;
    --muted:#334155;
    --input:#ffffff;

}

body.light-mode .login-card{

    background:rgba(255,255,255,.95);
    box-shadow:0 20px 60px rgba(30,50,80,.12);

}

body.light-mode input{

    background:#ffffff;
    color:#172033;

}

/* THEME BUTTON */

.theme-toggle{

    position:fixed;
    top:25px;
    right:25px;
    width:45px;
    height:45px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    cursor:pointer;
    font-size:20px;

}

/* RESPONSIVE */

@media(max-width:500px){

    .login-card{

        padding:28px 22px;

    }

    .heading h1{

        font-size:26px;

    }

}

</style>

</head>

<body>

<button class="theme-toggle" id="themeToggle">

☾

</button>

<div class="login-card">

<div class="logo">

NEXA <span>HUB</span> AI

</div>

<div class="heading">

<h1>

Welcome Back

</h1>

<p>

Login to manage your business.

</p>

</div>

<form id="loginForm">

<div class="form-group">

<label>

Email Address

</label>

<input

type="email"

placeholder="Enter your email"

required

>

</div>

<div class="form-group">

<label>

Password

</label>

<div class="password-box">

<input

type="password"

id="password"

placeholder="Enter your password"

required

>

<span

class="password-toggle"

id="passwordToggle"

>

👁

</span>

</div>

</div>

<div class="options">

<label class="remember">

<input type="checkbox">

Remember me

</label>

<a href="#" class="forgot">

Forgot Password?

</a>

</div>

<button

type="submit"

class="login-btn"

>

Login

</button>

</form>

<div class="divider">

OR

</div>

<div class="signup-text">

Don't have an account?

<a href="signup.html">

Create Account

</a>

</div>

</div>

<script>

const themeToggle = document.getElementById("themeToggle");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "light"){

    document.body.classList.add("light-mode");

    themeToggle.textContent = "☀";

}

themeToggle.addEventListener("click",function(){

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){

        themeToggle.textContent = "☀";

        localStorage.setItem("theme","light");

    }

    else{

        themeToggle.textContent = "☾";

        localStorage.setItem("theme","dark");

    }

});

const password = document.getElementById("password");

const passwordToggle = document.getElementById("passwordToggle");

passwordToggle.addEventListener("click",function(){

    if(password.type === "password"){

        password.type = "text";

        passwordToggle.textContent = "🙈";

    }

    else{

        password.type = "password";

        passwordToggle.textContent = "👁";

    }

});

document.getElementById("loginForm")

.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Login successful!");

});

</script>

</body>

</html>
