<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | {{ company_profile.name|default:"ManufacturingERP" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg,#101935,#2954e6); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif;}
        .login-card { background:#fff; border-radius:16px; padding:40px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.25);}
        .brand { text-align:center; font-weight:700; font-size:1.4rem; color:#1b2a55; margin-bottom:24px;}
        .brand i { color:#2954e6; }
        .btn-primary { background:#2954e6; border-color:#2954e6; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><i class="fa-solid fa-industry"></i> {{ company_profile.name|default:"ManufacturingERP" }}</div>
        {% if form.errors %}<div class="alert alert-danger py-2">Invalid username or password.</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
        <div class="text-center mt-3" style="font-size:.85rem;">
            New owner? <a href="{% url 'signup' %}">Create an account</a>
        </div>
    </div>
</body>
</html>
